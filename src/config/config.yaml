paths:
  dataset: "dataset/ecommerce_sessions.csv"
  data_dictionary: "dataset/data_dictionary.csv"
  models_dir: "models/"

random_seed: 42

target_column: "Converted"

split:
  test_size: 0.2
  stratify: true

categorical_columns:
  - "OperatingSystems"
  - "Browser"
  - "Region"
  - "TrafficType"
  - "VisitorType"
  - "Month"
  - "Weekend"

decision_threshold: 0.45