name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API dependencies (used for lint + test)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt
          pip install black ruff pytest httpx

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Check formatting with black
        run: black --check src/ tests/

      - name: Run tests
        run: pytest tests/ -v

  docker-build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f docker/Dockerfile.api -t purchase-intent-api .

      - name: Build Dashboard image
        run: docker build -f docker/Dockerfile.dashboard -t purchase-intent-dashboard .